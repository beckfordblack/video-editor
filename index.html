<!DOCTYPE html>
<html lang="ja">
<head>
    <title>2D Fluid Simulation</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {padding: 0; margin: 0;}
        html, body {width: 100%; height: 100%; overflow: hidden;}
        body {
            background: #242321;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {border: solid 1px  black;}
    </style>
</head>
<body>
    <canvas id="canvas" width="720px" height="1280px"></canvas>
    <script src="Playground.js"></script>
    <script src="Simulation.js"></script>
    <script src="Vector2.js"></script>
    <script src="DrawUtils.js"></script>
    <script src="Particle.js"></script>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let lastTime = performance.now();
        let currentTime = 0;
        let deltaTime = 0;

        let playground = new Playground();

        mainLoop();

        function updatePlayground(dt) {
            clear();
            playground.update(dt);
            playground.draw();
        }

        function mainLoop() {
            window.requestAnimationFrame(mainLoop);
            
            currentTime = performance.now();
            deltaTime = (currentTime - lastTime) / 1000;

            updatePlayground(deltaTime);
            lastTime = currentTime;
        }

        function clear() {
            ctx.fillStyle = "#242321";
            ctx.fillRect(0, 0, canvas.width, canvas.height)
        }

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        canvas.addEventListener("pointermove", function(evt) {
            let mouse = getMousePos(canvas, evt);
            playground.onMouseMove(new Vector2(mouse.x, mouse.y));
        }, false)

        canvas.addEventListener("pointerdown", function(evt) {
            playground.onMouseDown(evt.button);
        }, false)

        canvas.addEventListener("pointerup", function(evt) {
            playground.onMouseUp(evt.button);
        }, false)

        resize();
        window.addEventListener("resize", resize)

        function resize() {
            const width = window.innerWidth / canvas.width;
            const height = window.innerHeight / canvas.height;
            canvas.style.scale = Math.min(width, height);
        }
    </script>
</body>
</html>
